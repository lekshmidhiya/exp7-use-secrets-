name: Use Secrets in GitHub Actions

on:
  push:
    branches:
      - main

jobs:
  secret-demo:
    runs-on: ubuntu-latest

    env:
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Display Safe Message
        run: echo "Secret is stored securely"

      - name: Use Secret in Command
        run: |
          echo "Using API key safely"
          echo "The secret value is hidden and not printed"

      - name: Example of Using Secret
        run: |
          if [ -n "$API_KEY" ]; then
            echo "API Key is available"
          else
            echo "API Key is missing"
          fi
